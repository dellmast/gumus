name: silver-alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: silver-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fiyati kontrol et
        run: python3 monitor.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GRAMS: ${{ secrets.GRAMS }}

      - name: Durumu kaydet
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "silver-bot"
            git config user.email "silver-bot@users.noreply.github.com"
            git add state.json
            git commit -m "state guncellendi"
            git push
          fi
